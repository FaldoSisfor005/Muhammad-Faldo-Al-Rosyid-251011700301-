    © Muhammad Faldo Al Rosyid (251011700301)

    <script>
        function updateSimpleClock() {
            var waktu = new Date();

            var jam = waktu.getHours().toString().padStart(2, '0');
            var menit = waktu.getMinutes().toString().padStart(2, '0');

            var tanggal = waktu.getDate() + "/" + 
                          (waktu.getMonth() + 1) + "/" + 
                          waktu.getFullYear();

            document.getElementById("simple-clock").innerHTML =
                tanggal + " | " + jam + ":" + menit;
        }

        updateSimpleClock();
        setInterval(updateSimpleClock, 30000);
    </script>
